# Config used by SkyWalking Eyes for license_headers.yml workflow

header:
  license:
    content: 'SPDX-License-Identifier: LGPL-3.0-or-later'

  paths-ignore:
    - 'dist'
    - 'licenses'
    - '**/*.md'
    - 'LICENSE'
    - 'NOTICE'
    - '.licenserc.yaml'
    - '.github'
    - '.gitignore'
    - '**/*.txt'
    - '**/*.json'
    - 'maeser/data/static/bootstrap-icons'
    - 'maeser/data/static/normalize.css'
    - 'example/vectorstores'
    - 'sphinx-docs'

  comment: on-failure