{% extends "base.html" %}
{% block title %}Manage Models{% endblock %}
{% block stylesheets %}
    <link rel="stylesheet" href="{{ url_for('static', filename='design.css') }}">
{% endblock %}
{% block content %}
    <h2>Existing Models</h2>
    {% if models %}
        <ul>
        {% for model in models %}
            <li class="file-entry">
                {{ model }}
                <a href="{{ url_for('edit_model', class_code=model) }}">Edit</a>

                <!-- Delete -->
                <form method="POST">
                    <input type="hidden" name="class_code" value="{{ model }}">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No models found.</p>
    {% endif %}
{% endblock %}
