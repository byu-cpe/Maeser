{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block stylesheets %}
    <link rel="stylesheet" href="{{ url_for('static', filename='design.css') }}">
{% endblock %}
{% block content %}
    <h2>Existing Models</h2>
    {% if models %}
        <ul>
        {% for model in models %}
            <li>
                {{ model }}
                <a href="{{ url_for('edit_model', class_code=model) }}">Edit</a>
                <!-- Optionally add delete button -->
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No models found.</p>
    {% endif %}
{% endblock %}
