name: Run Python tests
on: [push, pull_request]
jobs:
  build:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements/requirements.txt
      - name: Install pytest
        run: pip install pytest
      - name: Set PYTHONPATH using GITHUB_ENV
        run: echo "PYTHONPATH=${{ github.workspace }}/maeser:$PYTHONPATH" >> $GITHUB_ENV
      - name: Run pytest
        run: pytest tests/
      - name: SkyWalking Eyes Header Fix
        uses: apache/skywalking-eyes/header@v0.7.0
        with:
          mode: fix
      - name: Apply SkyWalking Eyes Header Changes
        uses: EndBug/add-and-commit@v4
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          author_name: License Bot
          author_email: license_bot@github.com
          message: 'Automatic application of license header'